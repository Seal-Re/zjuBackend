# Fastop 本地一体化栈 — 端口段统一在 20001-20020
#
# 启动: docker compose -f infra/docker-compose.yml up -d
# 关闭: docker compose -f infra/docker-compose.yml down
# 重置数据: docker compose -f infra/docker-compose.yml down -v
#
# 端口分配 (host -> container):
#   20001  MySQL 8.0           (container 3306)
#   20002  auth-mock-service   (container 5000)  Flask
#   20003  device-controller-mock (container 5001)  Flask
#   20004  fastop backend      (container 8080)  Spring Boot
#   20005  frontend (nginx)    (container 80)    生产构建预览
#   20006-20010  保留 (fastop 扩展 / 第二实例)
#   20011  EMS affair-center        预留 (若并入 EMS 时启用)
#   20012  EMS subscribe-center     预留
#   20013  RocketMQ NameServer      预留
#   20014  RocketMQ Broker          预留
#   20015  Nacos                    预留
#   20016  Redis                    预留
#   20017-20020 通用预留

name: fastop

networks:
  fastop-net:
    driver: bridge

volumes:
  mysql-data:

services:

  mysql:
    image: mysql:8.0
    container_name: fastop-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Fastop@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autosys_1014}
      TZ: Asia/Shanghai
    ports:
      - "20001:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # SQL 初始化脚本：MySQL 容器首次启动会按文件名顺序执行 *.sql / *.sh
      - ../fastop/dataset:/docker-entrypoint-initdb.d:ro
    networks: [fastop-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-Fastop@123}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-mock:
    build:
      context: ../auth-mock-service
      dockerfile: ../infra/Dockerfile.python-mock
    image: fastop/auth-mock:dev
    container_name: fastop-auth-mock
    restart: unless-stopped
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: 5000
    ports:
      - "20002:5000"
    networks: [fastop-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/userinfo', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  device-mock:
    build:
      context: ../device-controller-mock
      dockerfile: ../infra/Dockerfile.python-mock
    image: fastop/device-mock:dev
    container_name: fastop-device-mock
    restart: unless-stopped
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: 5001
    ports:
      - "20003:5001"
    networks: [fastop-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: fastop/backend:dev
    container_name: fastop-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      auth-mock:
        condition: service_started
      device-mock:
        condition: service_started
    environment:
      # Spring Boot port (容器内 8080，宿主机映射到 20004)
      FASTOP_SERVER_PORT: 8080
      # 数据库
      FASTOP_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-autosys_1014}?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      FASTOP_DATASOURCE_USERNAME: root
      FASTOP_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Fastop@123}
      # 设备控制器 (容器间走 service 名)
      FASTOP_DEVICE_CONTROLLER_URL: http://device-mock:5001
      # EMS 默认空 — 若并入 EMS 后将其指向 affair-center
      FASTOP_EMS_URL: ${FASTOP_EMS_URL:-}
      FASTOP_EMS_SEND_PATH: ${FASTOP_EMS_SEND_PATH:-/addDefault}
      FASTOP_EMS_ABILITY_DEFAULT: ${FASTOP_EMS_ABILITY_DEFAULT:-fastop.send}
      # 认证服务 (UserContextInterceptor 调用 /userinfo)
      AUTH_SERVICE_URL: http://auth-mock:5000
      # JVM
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -Duser.timezone=Asia/Shanghai"
      # 压测期间打开 metrics/threaddump/heapdump 端点 (生产部署应收敛)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,threaddump,heapdump,prometheus,mappings,beans"
    ports:
      - "20004:8080"
    networks: [fastop-net]

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        # 构建时注入：让前端打包的 axios baseURL 走宿主机 20004
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_AUTH_API_BASE: ${VITE_AUTH_API_BASE:-/auth-api}
    image: fastop/frontend:dev
    container_name: fastop-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - auth-mock
    ports:
      - "20005:80"
    networks: [fastop-net]
