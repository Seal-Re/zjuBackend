name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'fastop/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'fastop/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fastop

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        
        cache-dependency-path: './fastop/**/pom.xml'

    - name: Build with Maven (含单元测试)
      run: mvn -B package

    - name: 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: 'fastop/**/target/surefire-reports/*.xml'
        if-no-files-found: ignore
        retention-days: 7
