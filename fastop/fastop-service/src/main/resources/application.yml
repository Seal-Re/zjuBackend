spring:
  application:
    name: service-designer
  profiles:
    active: ${FASTOP_PROFILES_ACTIVE:dev}
  datasource:
    druid:
      url: ${FASTOP_DATASOURCE_URL:jdbc:mysql://localhost:3304/autosys_1014}
      username: ${FASTOP_DATASOURCE_USERNAME:root}
      password: ${FASTOP_DATASOURCE_PASSWORD:Fastop@123}

server:
  port: ${FASTOP_SERVER_PORT:10001}
  servlet:
    context-path: /fastop

mybatis:
  mapper-locations: classpath:/mapper/*.xml

fastop:
  integration:
    device-controller-url: ${FASTOP_DEVICE_CONTROLLER_URL:http://localhost:5001}
    ems-url: ${FASTOP_EMS_URL:http://192.168.1.97:11452/subscribe/product}
    ems-send-path: ${FASTOP_EMS_SEND_PATH:/addDefault}
    ems-ability-default: ${FASTOP_EMS_ABILITY_DEFAULT:fastop.send}
