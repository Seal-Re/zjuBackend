spring:
  application:
    name: service-designer
  profiles:
    active: ${FASTOP_PROFILES_ACTIVE:dev}
  datasource:
    druid:
      url: ${FASTOP_DATASOURCE_URL:jdbc:mysql://localhost:3304/autosys_1014}
      username: ${FASTOP_DATASOURCE_USERNAME:root}
      password: ${FASTOP_DATASOURCE_PASSWORD:Fastop@123}
  security:
    oauth2:
      client:
        registration:
          idp:
            client-id: ${IDP_CLIENT_ID:client}
            client-secret: ${IDP_CLIENT_SECRET:secret}
            authorization-grant-type: authorization_code
            # 默认：dev 模式让回调走 Vite 代理（cookie 会种在前端 origin 上）。
            # 生产同源部署时改成 "{baseUrl}/login/oauth2/code/{registrationId}"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          idp:
            issuer-uri: http://192.168.1.97:8080

server:
  port: ${FASTOP_SERVER_PORT:10001}
  servlet:
    context-path: /fastop
    session:
      cookie:
        name: FASTOP_SESSIONID
        path: /

mybatis:
  mapper-locations: classpath:/mapper/*.xml

fastop:
  integration:
    device-controller-url: ${FASTOP_DEVICE_CONTROLLER_URL:http://localhost:5001}
    ems-url: ${FASTOP_EMS_URL:http://192.168.1.97:11452/subscribe/product}
    ems-send-path: ${FASTOP_EMS_SEND_PATH:/addDefault}
    ems-ability-default: ${FASTOP_EMS_ABILITY_DEFAULT:fastop.send}
  web:
    frontend-origin: ${FASTOP_FRONTEND_ORIGIN:http://localhost:5173}
    post-login-redirect: ${FASTOP_POST_LOGIN_REDIRECT:http://localhost:5173/}
